schema_version: "1.0"
product_type: SOLE_PROPRIETOR_LOAN
steps:
  PRODUCT_SELECTION:
    order: 1
    events: [JOURNEY_STARTED, PRODUCT_VIEWED]
  BUSINESS_INFORMATION:
    order: 2
    events: [BUSINESS_INFORMATION_COMPLETED]
  IDENTITY_VERIFICATION:
    order: 3
    events: [IDENTITY_VERIFICATION_STARTED, IDENTITY_VERIFICATION_COMPLETED]
  LIMIT_CHECK:
    order: 4
    events: [LIMIT_CHECK_STARTED, LIMIT_CHECK_COMPLETED]
  INCOME_VERIFICATION:
    order: 5
    events: [INCOME_VERIFICATION_STARTED, INCOME_VERIFICATION_COMPLETED, INCOME_VERIFICATION_FAILED]
  DOCUMENT_SUBMISSION:
    order: 6
    events: [DOCUMENT_UPLOAD_STARTED, DOCUMENT_UPLOAD_COMPLETED, DOCUMENT_UPLOAD_FAILED, DOCUMENT_REQUIRED]
  APPLICATION_COMPLETION:
    order: 7
    events: [JOURNEY_COMPLETED]
  SUPPORT:
    order: null
    events: [SUPPORT_REQUESTED, CONTEXT_SHARING_CONSENTED, CALL_STARTED, CALL_COMPLETED, JOURNEY_RESUMED]
